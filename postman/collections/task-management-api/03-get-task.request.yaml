$kind: http-request
name: Get task by id
order: 3000
method: GET
url: '{{base_url}}/api/tasks/{{task_id}}'
pathVariables:
  - key: task_id
    value: '{{task_id}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('get returns 200', function () {
        pm.response.to.have.status(200);
      });

      if (pm.response.code === 200) {
        pm.test('returned task matches the created id', function () {
          pm.expect(pm.response.json().id).to.eql(pm.environment.get('task_id'));
        });
      }
